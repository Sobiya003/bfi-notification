name: BFI Odyssey monitor

# Runs the monitor on a schedule for free using GitHub Actions.
# Use a PUBLIC repo so the runner minutes are unlimited (state.json only holds
# public showtimes, nothing sensitive). Your ntfy topic stays private via a secret.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay a few min)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

concurrency:
  group: bfi-odyssey-monitor
  cancel-in-progress: false

permissions:
  contents: write             # so it can commit the updated state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bfi_odyssey_monitor.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "odyssey-bot"
            git config user.email "odyssey-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update screening state [skip ci]"
            git push
          fi
